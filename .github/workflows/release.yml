name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild symexe.sln /p:Configuration=Release /p:Platform=x64

      - name: Create zip
        run: |
          Compress-Archive -Path x64/Release/symexe.exe, README.md -DestinationPath symexe-${{ github.ref_name }}-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: symexe-*.zip
